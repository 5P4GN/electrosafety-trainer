<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="Тренажёр по электробезопасности: II группа до 1000 В, 87 вопросов">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ЭБ II группа">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>ЭБ II группа — 87 вопросов</title>
<style>
:root{
  --bg:#0b0d10;--panel:#15181d;--panel2:#1c2026;--line:#2b3038;
  --text:#f4f6f8;--muted:#9aa3ad;--good:#39c17e;--bad:#ff6262;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit;touch-action:manipulation}
.wrap{max-width:720px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}
.title{font-size:24px;font-weight:800;letter-spacing:-.03em}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:999px;background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.setup{display:grid;gap:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px 12px;min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:48px}
.toggle input{width:20px;height:20px;accent-color:white}
.btn{width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel2);color:var(--text);padding:15px 16px;font-weight:750;min-height:52px}
.btn.primary{background:white;color:#111;border-color:white}
.btn.secondary{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:var(--muted)}
.quiz{display:none}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:10px}
.progress{height:7px;background:#232831;border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;background:white;width:0;transition:.2s}
.question{font-size:21px;line-height:1.35;font-weight:800;letter-spacing:-.015em;margin-bottom:14px}
.options{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:14px;display:flex;gap:11px;align-items:flex-start;line-height:1.4;min-height:58px}
.opt .n{width:30px;height:30px;border:1px solid #3d444f;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;font-weight:800}
.opt.correct{border-color:var(--good);background:rgba(57,193,126,.10)}
.opt.wrong{border-color:var(--bad);background:rgba(255,98,98,.10)}
.feedback{display:none;margin-top:12px;border-radius:14px;padding:12px 13px;border:1px solid var(--line);line-height:1.35}
.feedback.show{display:block}
.feedback.good{border-color:rgba(57,193,126,.6);background:rgba(57,193,126,.08)}
.feedback.bad{border-color:rgba(255,98,98,.6);background:rgba(255,98,98,.08)}
.feedback small{color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px;position:sticky;bottom:max(10px,env(safe-area-inset-bottom));padding-top:10px;background:linear-gradient(180deg,transparent,var(--bg) 28%)}
.finish{display:none;text-align:center}
.score{font-size:56px;font-weight:900;letter-spacing:-.06em;margin:8px 0}
.review{text-align:left;display:grid;gap:8px;margin-top:14px}
.review .item{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px;font-size:13px}
.review .item div{color:var(--muted);margin-top:4px;line-height:1.35}
.note{font-size:12px;line-height:1.45;color:var(--muted);margin-top:12px}
.hidden{display:none!important}
@media(max-width:420px){
  .wrap{padding:10px} .row{grid-template-columns:1fr} .question{font-size:20px} .title{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">Электробезопасность</div>
    <div class="badge">II группа · до 1000 В</div>
  </div>

  <section id="setup" class="card setup">
    <div>
      <label>Режим</label>
      <select id="mode">
        <option value="all">Все 87 вопросов</option>
        <option value="random20">20 случайных</option>
        <option value="random10">10 случайных</option>
        <option value="mistakes">Только мои ошибки</option>
      </select>
    </div>
    <div>
      <label>Тема</label>
      <select id="topic"><option value="all">Все темы</option></select>
    </div>
    <div class="row">
      <label class="toggle"><input id="shuffleQ" type="checkbox" checked><span>Перемешать вопросы</span></label>
      <label class="toggle"><input id="shuffleA" type="checkbox"><span>Перемешать ответы</span></label>
    </div>
    <button id="start" class="btn primary">Начать тренировку</button>
    <button id="reset" class="btn">Сбросить статистику</button>
    <div class="note">После первого открытия через интернет тренажёр доступен офлайн. На iPhone: Safari → «Поделиться» → «На экран Домой». Статистика хранится на самом устройстве.</div>
  </section>

  <section id="stats" class="stats">
    <div class="stat"><b id="stTotal">0</b><span>ответов</span></div>
    <div class="stat"><b id="stRate">—</b><span>точность</span></div>
    <div class="stat"><b id="stClean">0</b><span>без ошибок</span></div>
    <div class="stat"><b id="stWeak">0</b><span>с ошибками</span></div>
  </section>

  <section id="quiz" class="card quiz">
    <div class="qhead"><span id="qTopic"></span><span id="counter"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <div class="nav">
      <button id="quit" class="btn">Назад</button>
      <button id="next" class="btn primary" disabled>Дальше</button>
    </div>
  </section>

  <section id="finish" class="card finish">
    <div style="font-size:13px;color:var(--muted)">Результат</div>
    <div id="score" class="score"></div>
    <div id="resultText"></div>
    <button id="again" class="btn primary" style="margin-top:14px">Ещё один заход</button>
    <button id="redo" class="btn secondary">Повторить ошибки</button>
    <div id="review" class="review"></div>
  </section>
</div>

<script>
const QUESTIONS = [{"id": 1, "topic": "Охрана труда и организация работ", "question": "На кого распространяются Правила по охране труда при эксплуатации электроустановок?", "options": ["На работников промышленных предприятий, в составе которых имеются электроустановки", "На работников организаций независимо от форм собственности и организационно-правовых форм и других физических лиц, занятых техническим обслуживанием электроустановок, проводящих в них оперативные переключения, организующих и выполняющих испытания и измерения", "На работодателей - юридических и физических лиц независимо от их организационно-правовых форм и работников из числа электротехнического, электротехнологического и неэлектротехнического персонала", "На работников всех организаций независимо от формы собственности, занятых техническим обслуживанием электроустановок и выполняющих в них строительные, монтажные и ремонтные работы"], "answer": 2}, {"id": 2, "topic": "Охрана труда и организация работ", "question": "При каком условии работники, не обслуживающие электроустановки, могут допускаться в РУ до 1000 В?", "options": ["В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу IV, либо работника, имеющего право единоличного осмотра", "В сопровождении оперативного персонала, обслуживающего данную электроустановку, имеющего группу III, либо работника, имеющего право единоличного осмотра", "В сопровождении опытного работника из числа ремонтного персонала, имеющего группу по электробезопасности не ниже V"], "answer": 1}, {"id": 3, "topic": "Охрана труда и организация работ", "question": "С какой целью допускается приближение на расстояние менее 8 метров к месту возникновения короткого замыкания на землю при работах на воздушной линии электропередачи?", "options": ["Только для оказания доврачебной помощи людям, попавшим под напряжение", "Только для определения визуального расстояния до опоры ВЛ", "Только для оперативных переключений с целью ликвидации замыкания и освобождения людей, попавших под напряжение"], "answer": 2}, {"id": 4, "topic": "Охрана труда и организация работ", "question": "Кто даёт разрешение на снятие напряжения при несчастных случаях для освобождения пострадавшего от действия электрического тока?", "options": ["Разрешение дает оперативный персонал энергообъекта", "Разрешение дает вышестоящий оперативный персонал", "Разрешение дает административно-технический персонал", "Предварительного разрешения оперативного персонала не требуется. Напряжение должно быть снято немедленно"], "answer": 3}, {"id": 5, "topic": "Охрана труда и организация работ", "question": "Каким образом не допускается производство работ в действующих электроустановках?", "options": ["По наряду-допуску", "По распоряжению", "На основании перечня работ, выполняемых в порядке текущей эксплуатации", "Самовольно"], "answer": 3}, {"id": 6, "topic": "Охрана труда и организация работ", "question": "Допускается ли самовольное проведение работ в действующих электроустановках, а также расширение рабочих мест и объема задания, определенных нарядом, распоряжением или утвержденным работодателем перечнем работ, выполняемых в порядке текущей эксплуатации?", "options": ["Допускается самовольное проведение работ только при возникновении аварийной ситуации с разрешения вышестоящего оперативного персонала", "Допускается расширение рабочих мест и объема задания, определенных нарядом или распоряжением при выполнении неотложных работ, для выполнения которых требуется более 1 часа, с разрешения производителя работ", "Допускается, учитывая важность электроустановки в технологическом процессе, с обязательной записью в оперативном журнале", "Самовольное проведение работ, расширение рабочих мест и объема задания, определенных нарядом, распоряжением или утвержденным работодателем перечнем работ, выполняемых в порядке текущей эксплуатации в действующих электроустановках не допускается"], "answer": 3}, {"id": 7, "topic": "Охрана труда и организация работ", "question": "Допустимо ли пребывание одного или нескольких членов бригады отдельно от производителя работ в случае рассредоточения членов бригады по разным рабочим местам?", "options": ["Недопустимо в любом случае", "Допустимо в любом случае", "Допустимо, при наличии у членов бригады III группы по электробезопасности", "Допустимо, при проведении соответствующего инструктажа"], "answer": 2}, {"id": 8, "topic": "Охрана труда и организация работ", "question": "В каких электроустановках могут выполняться работы в порядке текущей эксплуатации?", "options": ["В электроустановках напряжением до 1000 В", "В любых электроустановках", "Только в электроустановках напряжением не выше 380 В", "В электроустановках напряжением до и выше 1000 В"], "answer": 0}, {"id": 9, "topic": "Охрана труда и организация работ", "question": "Какие из перечисленных можно отнести к работам, выполняемым в порядке текущей эксплуатации в электроустановках напряжением до 1000 В?", "options": ["Снятие и установка электросчетчиков, других приборов и средств измерений", "Ремонт пусковой и коммутационной аппаратуры, установленной на щитках", "Замена ламп и чистка светильников на высоте более 2,5 м", "Любые из перечисленных работ"], "answer": 0}, {"id": 10, "topic": "Охрана труда и организация работ", "question": "Какие из перечисленных мероприятий необходимо учитывать при оформлении перечня работ, выполняемых в порядке текущей эксплуатации?", "options": ["Только условия безопасности и возможности единоличного выполнения конкретных работ?", "Только квалификацию персонала", "Только степень важности электроустановки в целом или ее отдельных элементов в технологическом процессе", "Необходимо учитывать все перечисленные мероприятия"], "answer": 3}, {"id": 11, "topic": "Охрана труда и организация работ", "question": "Какой инструктаж должен пройти электротехнический персонал перед началом работ по распоряжению?", "options": ["Первичный на рабочем месте", "Вводный инструктаж", "Целевой инструктаж", "Повторный инструктаж"], const $=s=>document.querySelector(s);
const KEY="eb87_ios_stats_v1";
let stats=JSON.parse(localStorage.getItem(KEY)||"{}"), session=[], pos=0, answered=false, ok=0, wrong=[];

function save(){localStorage.setItem(KEY,JSON.stringify(stats))}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function getRec(id){return stats[id]||(stats[id]={tries:0,correct:0,wrong:0})}
function updateStats(){
  let t=0,c=0,cl=0,w=0;
  QUESTIONS.forEach(q=>{let r=stats[q.id];if(!r)return;t+=r.tries||0;c+=r.correct||0;if((r.wrong||0)>0)w++;if((r.tries||0)>0&&(r.wrong||0)===0)cl++;});
  $("#stTotal").textContent=t;$("#stRate").textContent=t?Math.round(c/t*100)+"%":"—";$("#stClean").textContent=cl;$("#stWeak").textContent=w;
}
[...new Set(QUESTIONS.map(q=>q.topic))].forEach(t=>{let o=document.createElement("option");o.value=t;o.textContent=t;$("#topic").appendChild(o)});

function makeSession(){
  let p=QUESTIONS.filter(q=>$("#topic").value==="all"||q.topic===$("#topic").value);
  let m=$("#mode").value;
  if(m==="mistakes")p=p.filter(q=>(stats[q.id]?.wrong||0)>0);
  if($("#shuffleQ").checked)p=shuf(p);
  if(m==="random20")p=p.slice(0,20);
  if(m==="random10")p=p.slice(0,10);
  return p;
}
function start(){
  session=makeSession();
  if(!session.length){alert("Пока нет вопросов для этого режима.");return}
  pos=0;answered=false;ok=0;wrong=[];
  $("#setup").classList.add("hidden");$("#stats").classList.add("hidden");$("#finish").style.display="none";$("#quiz").style.display="block";
  render();window.scrollTo(0,0);
}
function render(){
  answered=false;$("#next").disabled=true;
  let q=session[pos];
  $("#qTopic").textContent=q.topic+" · № "+q.id;$("#counter").textContent=(pos+1)+" / "+session.length;
  $("#bar").style.width=(pos/session.length*100)+"%";$("#question").textContent=q.question;
  $("#feedback").className="feedback";$("#feedback").innerHTML="";
  let ops=q.options.map((text,i)=>({text,orig:i}));if($("#shuffleA").checked)ops=shuf(ops);
  $("#options").innerHTML="";
  ops.forEach((o,i)=>{
    let b=document.createElement("button");b.className="opt";b.dataset.orig=o.orig;
    b.innerHTML=`<span class="n">${i+1}</span><span>${escapeHtml(o.text)}</span>`;
    b.onclick=()=>choose(b,q,o.orig);$("#options").appendChild(b);
  });
  $("#next").textContent=pos===session.length-1?"Завершить":"Дальше";
}
function choose(btn,q,idx){
  if(answered)return;answered=true;
  let correct=idx===q.answer,r=getRec(q.id);r.tries++;
  if(correct){r.correct++;ok++}else{r.wrong++;wrong.push(q)}save();updateStats();
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;let i=Number(b.dataset.orig);if(i===q.answer)b.classList.add("correct");if(b===btn&&!correct)b.classList.add("wrong");
  });
  let f=$("#feedback");f.className="feedback show "+(correct?"good":"bad");
  f.innerHTML=correct?`<b>Верно.</b><br><small>Вопрос № ${q.id}</small>`:`<b>Ошибка.</b><br><small>Правильный ответ: ${escapeHtml(q.options[q.answer])}</small>`;
  $("#next").disabled=false;$("#bar").style.width=((pos+1)/session.length*100)+"%";
}
function next(){if(!answered)return;if(pos<session.length-1){pos++;render();window.scrollTo(0,0)}else finish()}
function finish(){
  $("#quiz").style.display="none";$("#finish").style.display="block";
  let pct=Math.round(ok/session.length*100);$("#score").textContent=pct+"%";$("#resultText").textContent=`${ok} из ${session.length} правильных`;
  let rev=$("#review");rev.innerHTML="";
  let u=[...new Map(wrong.map(q=>[q.id,q])).values()];
  if(!u.length)rev.innerHTML='<div class="item"><b>Чистый проход.</b><div>Ошибок нет.</div></div>';
  else u.forEach(q=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<b>№ ${q.id}</b><div>${escapeHtml(q.question)}</div>`;rev.appendChild(d)});
  window.scrollTo(0,0);
}
function home(){$("#quiz").style.display="none";$("#finish").style.display="none";$("#setup").classList.remove("hidden");$("#stats").classList.remove("hidden");updateStats();window.scrollTo(0,0)}
$("#start").onclick=start;$("#next").onclick=next;$("#quit").onclick=home;$("#again").onclick=home;
$("#redo").onclick=()=>{home();$("#mode").value="mistakes"};
$("#reset").onclick=()=>{if(confirm("Сбросить статистику?")){stats={};save();updateStats()}};
updateStats();

if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
